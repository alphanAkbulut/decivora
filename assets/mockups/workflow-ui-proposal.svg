="360" class="label strong">Check target</text><text x="834" y="379" class="label strong">file revision</text><text x="834" y="422" class="small">Evidence pending</text><text x="834" y="449" class="small">Unassigned</text><rect x="965" y="251" width="138" height="534" rx="8" fill="#f0f3f7" stroke="none"/><rect x="974" y="268" width="6" height="6" rx="3" fill="#378565" stroke="none"/><text x="985" y="279" class="small">Done</text><text x="1081" y="279" class="small">0</text><text x="979" y="334" class="small">No verified tasks</text><text x="222" y="823" class="small">Closed work ▸ Cancelled / Obsolete / Duplicate</text><text x="222" y="850" class="small">Changing a view or filter never approves a task.</text><rect x="1130" y="176" width="410" height="704" rx="0" fill="#fff" stroke="none"/><path d="M1130,176 L1130,880" stroke="#e1e5ed"/><text x="1151" y="210" class="small">D-103   /   Task details</text><text x="1502" y="210" class="heading">×</text><text x="1151" y="247" class="heading">Connect selected source</text><text x="1151" y="281" class="label strong" style="fill:#2d76c5">In Progress</text><rect x="1311" y="259" width="78" height="29" rx="5" fill="#ffe4e7" stroke="none"/><text x="1323" y="279" class="label" style="fill:#9b273b">Blocked</text><text x="1151" y="319" class="small">Owner</text><text x="1292" y="319" class="label">Unassigned</text><text x="1151" y="351" class="small">Blocked by</text><text x="1292" y="351" class="label">Read permission</text><text x="1151" y="383" class="small">Next action</text><text x="1292" y="383" class="label">Owner reviews access</text><path d="M1151,404 L1518,404" stroke="#e1e5ed"/><text x="1151" y="433" class="small" style="fill:#236bba">Overview</text><text x="1247" y="433" class="small" style="fill:#67758a">AC / DoD</text><text x="1344" y="433" class="small" style="fill:#67758a">Sources</text><text x="1434" y="433" class="small" style="fill:#67758a">History</text><text x="1151" y="473" class="small">WHY THIS TASK EXISTS</text><text x="1151" y="502" class="label">Track decisions without losing source context.</text><text x="1151" y="548" class="small">ACCEPTANCE / EVIDENCE</text><text x="1151" y="580" class="label">○ Source identity checked — Not Run</text><text x="1151" y="611" class="label">○ Scope matches permission — Pending</text><text x="1151" y="651" class="small">Latest decision: selected-source access only</text><text x="1151" y="698" class="small">HISTORY</text><text x="1151" y="728" class="small">Work started → permission blocker recorded</text><text x="1151" y="759" class="small">Original claims and decisions stay linked.</text><rect x="1151" y="803" width="158" height="37" rx="6" fill="#e7edf7" stroke="none"/><text x="1165" y="827" class="label strong">Review blocker</text><text x="1324" y="827" class="small">No automatic Done</text></svg>