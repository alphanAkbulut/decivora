<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="880" viewBox="0 0 1540 880" role="img" aria-labelledby="title desc"><title id="title">Decivora UI proposal — not implemented</title><desc id="desc">Conventional sidebar, board toolbar, six workflow columns and selected task detail panel. All records are synthetic design examples.</desc><style>text{font-family:Arial,sans-serif;fill:#243247}.small{font-size:12px;fill:#67758a}.label{font-size:13px}.strong{font-weight:700}.heading{font-size:18px;font-weight:700}</style><rect x="0" y="0" width="1540" height="880" rx="0" fill="#f8fafc" stroke="none"/><rect x="0" y="0" width="1540" height="40" rx="0" fill="#fff3d5" stroke="none"/><text x="20" y="25" class="label">DESIGN PROPOSAL · Not implemented · Synthetic examples · No real model or verification results</text><rect x="0" y="40" width="196" height="840" rx="0" fill="#f1f4f8" stroke="none"/><path d="M196,40 L196,880" stroke="#e1e5ed"/><text x="24" y="83" class="heading">Decivora</text><text x="24" y="118" class="small">Personal workspace</text><text x="24" y="158" class="small">PROJECT</text><text x="24" y="188" class="label strong">Local memory pilot  ▾</text><text x="28" y="244" class="label">Overview</text><text x="28" y="288" class="label">Conversations</text><text x="28" y="332" class="label">Review inbox</text><rect x="14" y="351" width="168" height="36" rx="7" fill="#e1eaf9" stroke="none"/><text x="28" y="376" class="label strong">Board</text><text x="28" y="420" class="label">Decisions</text><text x="28" y="464" class="label">Sources</text><text x="25" y="746" class="small">Local storage</text><text x="25" y="773" class="small">Model: not connected</text><text x="25" y="824" class="small">Language  English ▾</text><rect x="196" y="40" width="1344" height="80" rx="0" fill="#fff" stroke="none"/><text x="222" y="76" class="heading">Local memory pilot</text><text x="222" y="104" class="small">Tasks and evidence from your conversations</text><text x="1364" y=